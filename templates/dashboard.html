{% extends "base.html" %}

{% block title %}Dashboard - Smart Clinic Management System{% endblock %}

{% block content %}
<h2 style="color: #333; margin-bottom: 20px;">📊 Dashboard</h2>

<div class="stats-grid" id="statsGrid"></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px;">
    <div class="card">
        <h3>📅 Upcoming Urgent Appointments</h3>
        <div id="urgentAppointments" style="margin-top: 15px;"></div>
    </div>

    <div class="card">
        <h3>👥 Recent Patients Added</h3>
        <div id="recentPatients" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    const loadDashboard = async () => {
        // Load stats
        try {
            const response = await fetch('/api/stats');
            const result = await response.json();
            
            if (result.success) {
                const stats = result.data;
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <h3>Total Patients</h3>
                        <div class="number">${stats.total_patients}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Doctors</h3>
                        <div class="number">${stats.total_doctors}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Total Appointments</h3>
                        <div class="number">${stats.total_appointments}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Scheduled Appointments</h3>
                        <div class="number">${stats.scheduled_appointments}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Urgent Cases</h3>
                        <div class="number" style="color: #ff6b6b;">${stats.urgent_appointments}</div>
                    </div>
                `;
            }
        } catch (error) {
            console.error('Error loading stats:', error);
        }

        // Load urgent appointments
        try {
            const response = await fetch('/api/appointments/urgent-appointments');
            const result = await response.json();
            
            const urgentDiv = document.getElementById('urgentAppointments');
            if (result.success && result.data.length > 0) {
                let html = '<table><thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th></tr></thead><tbody>';
                result.data.forEach(apt => {
                    html += `
                        <tr>
                            <td>${apt.patient_name}</td>
                            <td>Dr. ${apt.doctor_name}</td>
                            <td>${apt.appointment_date}</td>
                            <td>${apt.appointment_time}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                urgentDiv.innerHTML = html;
            } else {
                urgentDiv.innerHTML = '<p style="color: #666;">No urgent appointments at this time.</p>';
            }
        } catch (error) {
            console.error('Error loading urgent appointments:', error);
            document.getElementById('urgentAppointments').innerHTML = '<p style="color: #666;">Error loading data.</p>';
        }

        // Load recent patients
        try {
            const response = await fetch('/api/patients');
            const result = await response.json();
            
            const recentDiv = document.getElementById('recentPatients');
            if (result.success && result.data.length > 0) {
                const recent = result.data.slice(-5).reverse();
                let html = '<table><thead><tr><th>Name</th><th>Age</th><th>Contact</th></tr></thead><tbody>';
                recent.forEach(patient => {
                    html += `
                        <tr>
                            <td>${patient.name}</td>
                            <td>${patient.age}</td>
                            <td>${patient.contact}</td>
                        </tr>
                    `;
                });
                html += '</tbody></table>';
                recentDiv.innerHTML = html;
            } else {
                recentDiv.innerHTML = '<p style="color: #666;">No patients added yet.</p>';
            }
        } catch (error) {
            console.error('Error loading recent patients:', error);
            document.getElementById('recentPatients').innerHTML = '<p style="color: #666;">Error loading data.</p>';
        }
    };

    document.addEventListener('DOMContentLoaded', loadDashboard);
    // Refresh every 30 seconds
    setInterval(loadDashboard, 30000);
</script>
{% endblock %}
