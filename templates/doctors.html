{% extends "base.html" %}

{% block title %}Doctors - Smart Clinic Management System{% endblock %}

{% block content %}
<h2 style="color: #333; margin-bottom: 20px;">👨‍⚕️ Doctor Management</h2>

<div id="alert"></div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search doctors by name or specialization..." />
    <button onclick="searchDoctors()">Search</button>
    <button class="success" onclick="openModal('addDoctorModal')">+ Add Doctor</button>
</div>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading doctors...</p>
</div>

<div id="doctorsList"></div>

<!-- Add Doctor Modal -->
<div id="addDoctorModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add New Doctor</h2>
            <button class="close" onclick="closeModal('addDoctorModal')">&times;</button>
        </div>
        <form id="addDoctorForm" onsubmit="addDoctor(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="doctorName" required />
                </div>
                <div class="form-group">
                    <label>Specialization *</label>
                    <input type="text" id="doctorSpecialization" required placeholder="e.g., Cardiology" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Contact Number *</label>
                    <input type="tel" id="doctorContact" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="doctorEmail" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Available Days</label>
                    <input type="text" id="doctorDays" value="Monday, Tuesday, Wednesday, Thursday, Friday" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="doctorStart" value="09:00" />
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="doctorEnd" value="17:00" />
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="secondary" onclick="closeModal('addDoctorModal')">Cancel</button>
                <button type="submit" class="success">Add Doctor</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Doctor Modal -->
<div id="editDoctorModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Edit Doctor</h2>
            <button class="close" onclick="closeModal('editDoctorModal')">&times;</button>
        </div>
        <form id="editDoctorForm" onsubmit="updateDoctor(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="editDoctorName" required />
                </div>
                <div class="form-group">
                    <label>Specialization *</label>
                    <input type="text" id="editDoctorSpecialization" required />
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editDoctorEmail" />
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Available Days</label>
                    <input type="text" id="editDoctorDays" />
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="editDoctorStart" />
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="editDoctorEnd" />
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="secondary" onclick="closeModal('editDoctorModal')">Cancel</button>
                <button type="submit" class="success">Update Doctor</button>
            </div>
        </form>
    </div>
</div>

<script>
    let currentDoctorId = null;

    const loadDoctors = async () => {
        showLoading(true);
        try {
            const response = await fetch('/api/doctors/');
            const result = await response.json();
            
            if (result.success) {
                displayDoctors(result.data);
            } else {
                showAlert(result.error || 'Error loading doctors', 'error');
            }
        } catch (error) {
            showAlert('Error loading doctors: ' + error, 'error');
        } finally {
            showLoading(false);
        }
    };

    const displayDoctors = (doctors) => {
        const doctorsList = document.getElementById('doctorsList');
        
        if (doctors.length === 0) {
            doctorsList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">No doctors found. Add your first doctor!</p>';
            return;
        }

        let html = '<table><thead><tr><th>Name</th><th>Specialization</th><th>Contact</th><th>Available Days</th><th>Hours</th><th>Actions</th></tr></thead><tbody>';
        
        doctors.forEach(doctor => {
            html += `
                <tr>
                    <td>Dr. ${doctor.name}</td>
                    <td>${doctor.specialization}</td>
                    <td>${doctor.contact}</td>
                    <td>${doctor.available_days}</td>
                    <td>${doctor.start_time} - ${doctor.end_time}</td>
                    <td>
                        <button onclick="openEditModal(${doctor.id})" style="padding: 5px 10px; font-size: 12px;">Edit</button>
                        <button class="danger" onclick="deleteDoctor(${doctor.id})" style="padding: 5px 10px; font-size: 12px;">Delete</button>
                    </td>
                </tr>
            `;
        });
        
        html += '</tbody></table>';
        doctorsList.innerHTML = html;
    };

    const addDoctor = async (event) => {
        event.preventDefault();
        
        const data = {
            name: document.getElementById('doctorName').value,
            specialization: document.getElementById('doctorSpecialization').value,
            contact: document.getElementById('doctorContact').value,
            email: document.getElementById('doctorEmail').value,
            available_days: document.getElementById('doctorDays').value,
            start_time: document.getElementById('doctorStart').value,
            end_time: document.getElementById('doctorEnd').value
        };

        try {
            const response = await fetch('/api/doctors/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {
                showAlert('Doctor added successfully!', 'success');
                closeModal('addDoctorModal');
                document.getElementById('addDoctorForm').reset();
                loadDoctors();
            } else {
                showAlert(result.error || 'Error adding doctor', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error, 'error');
        }
    };

    const openEditModal = async (doctorId) => {
        try {
            const response = await fetch(`/api/doctors/${doctorId}`);
            const result = await response.json();

            if (result.success) {
                const doctor = result.data;
                currentDoctorId = doctor.id;
                document.getElementById('editDoctorName').value = doctor.name;
                document.getElementById('editDoctorSpecialization').value = doctor.specialization;
                document.getElementById('editDoctorEmail').value = doctor.email;
                document.getElementById('editDoctorDays').value = doctor.available_days;
                document.getElementById('editDoctorStart').value = doctor.start_time;
                document.getElementById('editDoctorEnd').value = doctor.end_time;
                openModal('editDoctorModal');
            }
        } catch (error) {
            showAlert('Error loading doctor: ' + error, 'error');
        }
    };

    const updateDoctor = async (event) => {
        event.preventDefault();

        const data = {
            name: document.getElementById('editDoctorName').value,
            specialization: document.getElementById('editDoctorSpecialization').value,
            email: document.getElementById('editDoctorEmail').value,
            available_days: document.getElementById('editDoctorDays').value,
            start_time: document.getElementById('editDoctorStart').value,
            end_time: document.getElementById('editDoctorEnd').value
        };

        try {
            const response = await fetch(`/api/doctors/${currentDoctorId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {
                showAlert('Doctor updated successfully!', 'success');
                closeModal('editDoctorModal');
                loadDoctors();
            } else {
                showAlert(result.error || 'Error updating doctor', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error, 'error');
        }
    };

    const deleteDoctor = async (doctorId) => {
        if (!confirm('Are you sure you want to delete this doctor?')) return;

        try {
            const response = await fetch(`/api/doctors/${doctorId}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            if (result.success) {
                showAlert('Doctor deleted successfully!', 'success');
                loadDoctors();
            } else {
                showAlert(result.error || 'Error deleting doctor', 'error');
            }
        } catch (error) {
            showAlert('Error: ' + error, 'error');
        }
    };

    const searchDoctors = async () => {
        const query = document.getElementById('searchInput').value.trim();
        
        if (!query) {
            loadDoctors();
            return;
        }

        showLoading(true);
        try {
            const response = await fetch(`/api/doctors/by-specialization/${encodeURIComponent(query)}`);
            const result = await response.json();

            if (result.success) {
                displayDoctors(result.data);
            } else {
                // Try fetching all and filtering by name
                const allResponse = await fetch('/api/doctors/');
                const allResult = await allResponse.json();
                const filtered = allResult.data.filter(d => 
                    d.name.toLowerCase().includes(query.toLowerCase()) ||
                    d.specialization.toLowerCase().includes(query.toLowerCase())
                );
                displayDoctors(filtered);
            }
        } catch (error) {
            showAlert('Error: ' + error, 'error');
        } finally {
            showLoading(false);
        }
    };

    document.addEventListener('DOMContentLoaded', loadDoctors);
</script>
{% endblock %}
